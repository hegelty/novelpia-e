<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>노벨피아 세션 내보내기</title>
  <style>
    body { width: 310px; margin: 16px; font: 14px/1.5 system-ui, sans-serif; color: #222; }
    h1 { font-size: 18px; margin: 0 0 12px; }
    p { margin: 0 0 12px; }
    button { padding: 9px 12px; cursor: pointer; }
    #status { margin-top: 12px; }
  </style>
  <script src="popup.js" defer></script>
</head>
<body>
  <h1>노벨피아 세션 내보내기</h1>
  <p>공식 노벨피아 또는 book.novelpia.com 탭에서 로그인하고 탭을 활성화하세요. 버튼을 누르면 브라우저 로그인 상태를 확인한 뒤 쿠키를 저장합니다. Android 앱은 로그인 상태를 별도로 확인해야 합니다.</p>
  <p><strong>주의:</strong> 세션 파일은 로그인 정보처럼 민감합니다. 다른 사람에게 보내지 말고, Android 앱에 가져온 뒤 파일을 삭제하세요.</p>
  <button id="export" type="button">세션 파일 저장</button>
  <p id="status" role="status" aria-live="polite"></p>
</body>
</html>
